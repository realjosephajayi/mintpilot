name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check   # no secrets, databases or local state in the repository
      - run: npm run lint
      - run: npm run test:unit       # includes the database migration tests
      - run: npm run test:contracts
